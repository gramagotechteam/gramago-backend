<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GramaGo Admin Login</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts for typography -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        :root {
            --primary-color: #10b981; /* Emerald 500 */
            --primary-hover: #059669; /* Emerald 600 */
            --dark-bg: #111827;
            --card-bg: rgba(255, 255, 255, 0.98);
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --border-radius: 20px;
            --shadow-lg: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }

        body.admin-login-body {
            font-family: 'Inter', sans-serif;
            background-color: var(--dark-bg);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
            overflow-y: auto;
        }

        /* Animated Background Gradient Orbs */
        .bg-shape {
            position: absolute;
            filter: blur(90px);
            opacity: 0.35;
            z-index: 0;
            animation: float 18s infinite ease-in-out alternate;
            pointer-events: none;
        }

        .shape-1 {
            width: 450px;
            height: 450px;
            background-color: rgba(16, 185, 129, 0.35);
            top: -100px;
            left: -100px;
            border-radius: 50%;
        }

        .shape-2 {
            width: 500px;
            height: 500px;
            background-color: rgba(59, 130, 246, 0.25);
            bottom: -150px;
            right: -100px;
            border-radius: 50%;
            animation-delay: -6s;
        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(40px, 40px) scale(1.1); }
        }

        /* Card Container */
        .admin-login-card {
            background-color: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-lg);
            overflow: hidden;
            position: relative;
            z-index: 10;
            animation: slideUpFade 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(25px);
        }

        @keyframes slideUpFade {
            to { opacity: 1; transform: translateY(0); }
        }

        .card-body {
            padding: 3rem 2.5rem !important;
        }

        /* Logo & Header */
        .brand-logo {
            width: 78px;
            height: 78px;
            object-fit: cover;
            margin-bottom: 1.25rem;
            border-radius: 50%;
            box-shadow: 0 10px 25px rgba(16, 185, 129, 0.3);
            border: 3px solid #ffffff;
            background-color: #ffffff;
            animation: popIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.2s forwards;
            opacity: 0;
            transform: scale(0.7);
        }

        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.5); }
            70% { transform: scale(1.1); }
            100% { opacity: 1; transform: scale(1); }
        }

        .brand-subtitle {
            color: var(--text-muted);
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            font-size: 0.75rem;
        }

        /* Form Controls */
        .form-label {
            font-weight: 600;
            font-size: 0.85rem;
            color: #374151;
            margin-bottom: 0.4rem;
        }

        .form-control {
            border-radius: 10px;
            border: 1px solid #d1d5db;
            padding: 0.75rem 1rem;
            font-size: 0.95rem;
            background-color: #f9fafb;
            transition: all 0.25s ease;
        }

        .form-control:focus {
            background-color: #ffffff;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.12);
            outline: none;
        }

        /* Login Button */
        .btn-success {
            background-color: var(--primary-color);
            border-color: var(--primary-color);
            border-radius: 10px;
            padding: 0.85rem 1.5rem;
            font-weight: 600;
            font-size: 1rem;
            letter-spacing: 0.3px;
            transition: all 0.25s ease;
            box-shadow: 0 10px 20px rgba(16, 185, 129, 0.2);
        }

        .btn-success:hover, .btn-success:focus {
            background-color: var(--primary-hover);
            border-color: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 14px 24px rgba(16, 185, 129, 0.3);
        }

        /* Alerts */
        .alert {
            border-radius: 10px;
            border: none;
            padding: 0.85rem 1rem;
            font-weight: 500;
            font-size: 0.9rem;
            animation: fadeIn 0.4s ease forwards;
        }

        .alert-success {
            background-color: #d1fae5;
            color: #065f46;
            border-left: 4px solid #10b981;
        }

        .alert-danger {
            background-color: #fee2e2;
            color: #991b1b;
            border-left: 4px solid #ef4444;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Mobile Adjustments */
        @media (max-width: 576px) {
            .card-body {
                padding: 2.25rem 1.5rem !important;
            }
        }
    </style>
</head>

<body class="admin-login-body">

    <!-- Background Shapes -->
    <div class="bg-shape shape-1"></div>
    <div class="bg-shape shape-2"></div>

    <div class="container">
        <div class="row justify-content-center w-100 m-0">
            <div class="col-12 col-sm-10 col-md-8 col-lg-5 col-xl-4 px-0">
                <div class="card admin-login-card">
                    <div class="card-body">
                        
                        <div class="text-center mb-4">
                            <img src="https://res.cloudinary.com/q1klzm53/image/upload/v1791180820/Logo.png" alt="GramaGo Logo" class="brand-logo shadow-sm">
                            <h2 class="fw-bold text-dark mb-1 fs-4">GramaGo</h2>
                            <p class="brand-subtitle mb-0">Admin Authentication</p>
                        </div>

                        {% if success %}
                        <div class="alert alert-success d-flex align-items-center mb-4" role="alert">
                            <i class="bi bi-check-circle-fill me-2 fs-5"></i>
                            <div>{{ success }}</div>
                        </div>
                        {% endif %}

                        {% if error %}
                        <div class="alert alert-danger d-flex align-items-center mb-4" role="alert">
                            <i class="bi bi-exclamation-triangle-fill me-2 fs-5"></i>
                            <div>{{ error }}</div>
                        </div>
                        {% endif %}

                        <form action="/admin/login" method="post">
                            <input type="hidden" name="_csrf_token" value="{{ csrf_token(request) }}">

                            <div class="mb-3">
                                <label class="form-label" for="identifierInput">
                                    <i class="bi bi-person me-1 text-muted"></i> Email or Phone
                                </label>
                                <input 
                                    type="text" 
                                    name="identifier" 
                                    id="identifierInput"
                                    class="form-control" 
                                    required 
                                    autofocus
                                    placeholder="Enter your email or phone"
                                >
                            </div>

                            <div class="mb-4">
                                <label class="form-label" for="passwordInput">
                                    <i class="bi bi-lock me-1 text-muted"></i> Password
                                </label>
                                <input 
                                    type="password" 
                                    name="password"
                                    id="passwordInput" 
                                    class="form-control" 
                                    required
                                    placeholder="Enter your password"
                                >
                            </div>

                            <button type="submit" class="btn btn-success w-100 shadow-sm">
                                <i class="bi bi-box-arrow-in-right me-2"></i> Sign In to Dashboard
                            </button>
                        </form>

                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
