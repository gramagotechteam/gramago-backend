<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GramaGo Admin Login</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Google Fonts for typography -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Bootstrap Icons (Optional, for future use) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        /* Base Styles */
        :root {
            --primary-color: #198754; /* Bootstrap success green */
            --primary-hover: #157347;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-main: #333333;
            --text-muted: #6c757d;
            --border-radius: 12px;
            --shadow-sm: 0 4px 6px rgba(0,0,0,0.05);
            --shadow-lg: 0 10px 30px rgba(0,0,0,0.1);
        }

        body.admin-login-body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 0% 0%, hsla(146,55%,41%,0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, hsla(146,55%,41%,0.15) 0px, transparent 50%);
            background-size: cover;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px 0;
            color: var(--text-main);
        }

        /* Card Styles */
        .admin-login-card {
            background-color: var(--card-bg);
            border: none;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow-lg);
            overflow: hidden;
            transform: translateY(0);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0; /* Starts hidden for animation */
        }

        .admin-login-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
        }

        .card-body {
            padding: 3rem 2rem !important;
        }

        /* Logo and Header */
        .brand-logo {
            width: 80px;
            height: 80px;
            object-fit: contain;
            margin-bottom: 1rem;
            animation: scaleIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.2s forwards;
            opacity: 0;
            transform: scale(0.8);
        }

        .brand-title {
            color: var(--primary-color);
            letter-spacing: -0.5px;
            font-weight: 700;
        }

        .text-muted {
            color: var(--text-muted) !important;
            font-weight: 500;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            font-size: 0.85rem;
        }

        /* Form Elements */
        .form-label {
            font-weight: 500;
            font-size: 0.9rem;
            color: #495057;
            margin-bottom: 0.5rem;
        }

        .form-control {
            border-radius: 8px;
            border: 1px solid #ced4da;
            padding: 0.75rem 1rem;
            font-size: 1rem;
            transition: all 0.3s ease;
            background-color: #fdfdfd;
        }

        .form-control:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 0.25rem rgba(25, 135, 84, 0.25);
            background-color: #fff;
        }

        /* Button */
        .btn-success {
            background-color: var(--primary-color);
            border-color: var(--primary-color);
            border-radius: 8px;
            padding: 0.85rem 1.5rem;
            font-weight: 600;
            font-size: 1rem;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(25, 135, 84, 0.2);
            position: relative;
            overflow: hidden;
        }

        .btn-success:hover, .btn-success:focus {
            background-color: var(--primary-hover);
            border-color: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(25, 135, 84, 0.3);
        }
        
        .btn-success:active {
            transform: translateY(0);
            box-shadow: 0 2px 4px rgba(25, 135, 84, 0.2);
        }

        /* Alerts */
        .alert {
            border-radius: 8px;
            border: none;
            padding: 1rem;
            font-weight: 500;
            font-size: 0.9rem;
            animation: fadeIn 0.5s ease forwards;
        }

        .alert-success {
            background-color: #d1e7dd;
            color: #0f5132;
        }

        .alert-danger {
            background-color: #f8d7da;
            color: #842029;
        }

        /* Animations */
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes scaleIn {
            from {
                opacity: 0;
                transform: scale(0.8);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Responsive adjustments */
        @media (max-width: 576px) {
            .card-body {
                padding: 2rem 1.5rem !important;
            }
            .admin-login-body {
                padding: 15px;
            }
        }
    </style>
</head>

<body class="admin-login-body">

<div class="container">
    <div class="row justify-content-center w-100 m-0">
        <!-- Slightly wider on medium screens, strictly constrained on large -->
        <div class="col-12 col-sm-10 col-md-8 col-lg-5 col-xl-4 px-0">
            <div class="card admin-login-card">
                <div class="card-body">
                    
                    <div class="text-center mb-4">
                        <!-- Added Logo Placeholder -->
                        <!-- Replace 'path/to/your/logo.png' with actual logo URL -->
                        <img src="https://res.cloudinary.com/q1klzm53/image/upload/v1791180820/Logo.png" alt="GramaGo Logo" class="brand-logo rounded-circle shadow-sm">
                        
                        
                        <p class="text-muted mb-0">
                            Admin Panel
                        </p>
                    </div>

                    {% if success %}
                    <div class="alert alert-success d-flex align-items-center" role="alert">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-check-circle-fill me-2" viewBox="0 0 16 16">
                            <path d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0zm-3.97-3.03a.75.75 0 0 0-1.08.022L7.477 9.417 5.384 7.323a.75.75 0 0 0-1.06 1.06L6.97 11.03a.75.75 0 0 0 1.079-.02l3.992-4.99a.75.75 0 0 0-.01-1.05z"/>
                        </svg>
                        <div>{{ success }}</div>
                    </div>
                    {% endif %}

                    {% if error %}
                    <div class="alert alert-danger d-flex align-items-center" role="alert">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-exclamation-triangle-fill me-2" viewBox="0 0 16 16">
                            <path d="M8.982 1.566a1.13 1.13 0 0 0-1.96 0L.165 13.233c-.457.778.091 1.767.98 1.767h13.713c.889 0 1.438-.99.98-1.767L8.982 1.566zM8 5c.535 0 .954.462.9.995l-.35 3.507a.552.552 0 0 1-1.1 0L7.1 5.995A.905.905 0 0 1 8 5zm.002 6a1 1 0 1 1 0 2 1 1 0 0 1 0-2z"/>
                        </svg>
                        <div>{{ error }}</div>
                    </div>
                    {% endif %}

                    <form action="/admin/login" method="post">
                        <input type="hidden" name="_csrf_token" value="{{ csrf_token(request) }}">

                        <div class="mb-3">
                            <label class="form-label" for="identifierInput">
                                Email or Phone
                            </label>
                            <input 
                                type="text" 
                                name="identifier" 
                                id="identifierInput"
                                class="form-control" 
                                required 
                                autofocus
                                placeholder="Enter your email or phone"
                            >
                        </div>

                        <div class="mb-4">
                            <label class="form-label" for="passwordInput">
                                Password
                            </label>
                            <input 
                                type="password" 
                                name="password"
                                id="passwordInput" 
                                class="form-control" 
                                required
                                placeholder="Enter your password"
                            >
                        </div>

                        <button type="submit" class="btn btn-success w-100">
                            Login
                        </button>
                    </form>

                </div>
            </div>
        </div>
    </div>
</div>

<!-- Optional: Bootstrap Bundle with Popper for any future interactive components -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
