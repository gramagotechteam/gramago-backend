<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome | GramaGo Admin</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        :root {
            --primary-color: #10b981;
            --primary-hover: #059669;
            --dark-bg: #111827;
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
        }

        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background-color: var(--dark-bg);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow-x: hidden;
            overflow-y: auto;
        }

        /* Animated Background Elements */
        .bg-shape {
            position: absolute;
            filter: blur(80px);
            opacity: 0.4;
            z-index: 0;
            animation: float 20s infinite ease-in-out alternate;
        }

        .shape-1 {
            width: 400px;
            height: 400px;
            background-color: rgba(16, 185, 129, 0.3); /* Emerald */
            top: -100px;
            left: -100px;
            border-radius: 50%;
        }

        .shape-2 {
            width: 500px;
            height: 500px;
            background-color: rgba(59, 130, 246, 0.2); /* Blue */
            bottom: -150px;
            right: -100px;
            border-radius: 50%;
            animation-delay: -5s;
        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(50px, 50px) scale(1.1); }
        }

        .landing-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 600px;
            padding: 3rem 1.5rem;
            margin: auto;
        }

        .landing-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 3rem 2.5rem;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            opacity: 0;
            transform: translateY(30px);
            animation: slideUpFade 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .brand-logo-img {
            width: 86px;
            height: 86px;
            object-fit: cover;
            border-radius: 50%;
            margin-bottom: 1.5rem;
            box-shadow: 0 10px 30px rgba(16, 185, 129, 0.4);
            transform: scale(0.8);
            opacity: 0;
            animation: popIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.3s forwards;
            background-color: #ffffff; /* Gives logo a crisp white backdrop */
            padding: 4px; /* Creates a clean inner ring */
        }

        .title {
            font-size: 2.25rem;
            font-weight: 800;
            letter-spacing: -0.05em;
            margin-bottom: 1rem;
            background: linear-gradient(to right, #ffffff, #a7f3d0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            opacity: 0;
            animation: slideUpFade 0.6s ease forwards 0.4s;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 2.5rem;
            opacity: 0;
            animation: slideUpFade 0.6s ease forwards 0.5s;
        }

        .btn-login {
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 1rem 2.5rem;
            font-size: 1.1rem;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px rgba(16, 185, 129, 0.2);
            opacity: 0;
            animation: slideUpFade 0.6s ease forwards 0.6s;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
        }

        .btn-login:hover {
            background-color: var(--primary-hover);
            color: white;
            transform: translateY(-3px);
            box-shadow: 0 15px 25px rgba(16, 185, 129, 0.3);
        }

        .btn-login i {
            transition: transform 0.3s ease;
        }
        
        .btn-login:hover i {
            transform: translateX(4px);
        }

        .features-wrap {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-top: 2.5rem;
            opacity: 0;
            animation: slideUpFade 0.6s ease forwards 0.7s;
        }

        .feature-badge {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #d1d5db;
            padding: 0.5rem 1rem;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }

        .feature-badge:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        .footer-text {
            position: relative;
            padding-bottom: 2rem;
            width: 100%;
            text-align: center;
            color: rgba(255, 255, 255, 0.3);
            font-size: 0.85rem;
            z-index: 10;
        }

        /* Animations */
        @keyframes slideUpFade {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.5); }
            70% { transform: scale(1.1); }
            100% { opacity: 1; transform: scale(1); }
        }

        /* Mobile adjustments */
        @media (max-width: 576px) {
            .landing-card {
                padding: 2.5rem 1.5rem;
            }
            .title {
                font-size: 1.75rem;
            }
        }
    </style>
</head>
<body>

    <!-- Background Animated Shapes -->
    <div class="bg-shape shape-1"></div>
    <div class="bg-shape shape-2"></div>

    <div class="landing-container">
        <div class="landing-card">
            
            <!-- Replace the src link with your actual logo URL -->
            <img src="https://res.cloudinary.com/q1klzm53/image/upload/v1791180820/Logo.png" alt="GramaGo Logo" class="brand-logo-img">

            <h1 class="title">GramaGo Operations</h1>
            
            <p class="subtitle">
                Welcome to the centralized management system. Monitor sales, track inventory, and handle customer orders with ease.
            </p>

            <a href="/admin/login" class="btn-login">
                Access Dashboard <i class="bi bi-arrow-right"></i>
            </a>

            <div class="features-wrap">
                <div class="feature-badge">
                    <i class="bi bi-graph-up-arrow text-success"></i> Real-time Analytics
                </div>
                <div class="feature-badge">
                    <i class="bi bi-box2 text-info"></i> Inventory Control
                </div>
                <div class="feature-badge">
                    <i class="bi bi-shield-check text-primary"></i> Secure Access
                </div>
            </div>

        </div>
    </div>

    <div class="footer-text">
        &copy; 2026 GramaGo Technologies. All rights reserved.
    </div>

</body>
</html>
